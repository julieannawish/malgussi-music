<script>


const RECENT_FOLDER_KEY='malgussi_recent_music_folder_v1';
function getRecentFolderMeta(){
  try{return JSON.parse(localStorage.getItem(RECENT_FOLDER_KEY)||'null')}catch(e){return null}
}
function saveRecentFolderMeta(files){
  const arr=Array.from(files||[]);
  if(!arr.length)return;
  const paths=arr.map(f=>f.webkitRelativePath||'').filter(Boolean);
  let folder='';
  if(paths.length){const parts=paths[0].split('/'); if(parts.length>1) folder=parts[0];}
  try{localStorage.setItem(RECENT_FOLDER_KEY,JSON.stringify({name:folder||'최근 음악 폴더',fileCount:arr.length,savedAt:new Date().toISOString()}))}catch(e){}
}

const VERIFIED_SCAN_KEY='malgussi_last_verified_scan_v1';
function saveVerifiedScan(files){
  const arr=Array.from(files||[]);
  const paths=arr.map(f=>f.webkitRelativePath||'').filter(Boolean);
  let folder='';
  if(paths.length){const parts=paths[0].split('/');if(parts.length>1)folder=parts[0];}
  try{localStorage.setItem(VERIFIED_SCAN_KEY,JSON.stringify({folder:folder||'최근 음악 폴더',count:arr.length,at:new Date().toISOString()}))}catch(e){}
}

const MUSIC_DIR_HANDLE_DB='malgussi_music_dir_handle_v1';
const MUSIC_DIR_HANDLE_STORE='handles';
async function openMusicHandleDB(){
  return await new Promise((resolve,reject)=>{
    const req=indexedDB.open(MUSIC_DIR_HANDLE_DB,1);
    req.onupgradeneeded=()=>req.result.createObjectStore(MUSIC_DIR_HANDLE_STORE);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function saveMusicDirectoryHandle(handle){
  try{
    if(!handle)return false;
    const db=await openMusicHandleDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(MUSIC_DIR_HANDLE_STORE,'readwrite');
      tx.objectStore(MUSIC_DIR_HANDLE_STORE).put(handle,'music');
      tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
    });
    return true;
  }catch(e){ return false; }
}
async function loadMusicDirectoryHandle(){
  try{
    const db=await openMusicHandleDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(MUSIC_DIR_HANDLE_STORE,'readonly');
      const req=tx.objectStore(MUSIC_DIR_HANDLE_STORE).get('music');
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function canUseSavedMusicDirectory(){
  const h=await loadMusicDirectoryHandle();
  if(!h || typeof h.queryPermission!=='function') return false;
  try{
    let p=await h.queryPermission({mode:'read'});
    return p==='granted';
  }catch(e){return false;}
}
const APP_VERSION='V3.33 FINAL';
const KEY='playlist_index_v321'; // PLAYLIST_KEY_COMPAT: keep for existing user data; app version is independent
const $=id=>document.getElementById(id);
const audio=$('audio');

let playlist=[];      // index records only: {id,name,size,lastModified,type}
let fileMap=new Map(); // File objects live only for the current session
let artworkMap=new Map();
let index=0;
let repeatAll=localStorage.getItem('repeatAll')!=='0';
let objectUrl=null;
let dragging=false;

function formatBytes(bytes){
  if(bytes<1024*1024) return `${(bytes/1024).toFixed(1)} KB`;
  if(bytes<1024*1024*1024) return `${(bytes/1024/1024).toFixed(1)} MB`;
  return `${(bytes/1024/1024/1024).toFixed(2)} GB`;
}

function saveList(){
  localStorage.setItem(KEY,JSON.stringify(playlist));
}

function loadIndex(){
  try{
    const raw=localStorage.getItem(KEY);
    playlist=raw?JSON.parse(raw):[];
    if(!Array.isArray(playlist))playlist=[];
  }catch(e){playlist=[]}
  updateUI();
  renderPlaylist();
  renderStorageInfo();
}

function renderStorageInfo(){
  const indexBytes=new Blob([JSON.stringify(playlist)]).size;
  const connected=playlist.filter(t=>fileMap.has(t.id)).length;
  $('storageInfo').innerHTML =
    `인덱스 ${playlist.length}곡 · 앱에 저장된 음악 파일 <b>0 MB</b><br>`+
    `현재 연결됨 ${connected}곡 · 인덱스 정보 약 ${formatBytes(indexBytes)}<br>`+
    `<span class="relink-note">※ MP3/M4A 등의 원본 파일은 앱 저장소로 복사하지 않습니다.</span>`;
}

function isAudioFile(f){
  const n=(f.name||'').toLowerCase();
  const ext=n.includes('.')?n.slice(n.lastIndexOf('.')):'';
  const allowed=['.mp3','.m4a','.mp4','.wav','.aac','.flac','.ogg','.oga','.opus','.aiff','.aif','.amr','.3gp','.m4b'];
  return allowed.includes(ext) || (f.type||'').toLowerCase().startsWith('audio/');
}


function decodeText(bytes){
  try{return new TextDecoder('utf-8').decode(bytes).replace(/\0/g,'').trim()}catch(e){return ''}
}
function synchsafe(b){return (b[0]<<21)|(b[1]<<14)|(b[2]<<7)|b[3]}

function parseID3Artwork(buf){
  const b=new Uint8Array(buf);
  if(b.length<10 || b[0]!==0x49 || b[1]!==0x44 || b[2]!==0x33) return null;
  const version=b[3], size=synchsafe(b.slice(6,10));
  let pos=10, end=Math.min(b.length,10+size);
  while(pos+10<=end){
    const id=String.fromCharCode(b[pos],b[pos+1],b[pos+2],b[pos+3]);
    let frameSize= version===4 ? synchsafe(b.slice(pos+4,pos+8)) :
      ((b[pos+4]<<24)|(b[pos+5]<<16)|(b[pos+6]<<8)|b[pos+7])>>>0;
    if(!id.trim() || frameSize<=0){pos+=1;continue}
    const dataStart=pos+10, dataEnd=Math.min(end,dataStart+frameSize);
    if(id==='APIC' || id==='PIC'){
      const d=b.slice(dataStart,dataEnd);
      let p=0; const enc=d[p++]; let mime='';
      while(p<d.length && d[p]!==0){mime+=String.fromCharCode(d[p++])} p++;
      if(mime==='image/jpg') mime='image/jpeg';
      if(id==='APIC'){
        if(p>=d.length)return null;
        p++;
        while(p<d.length && d[p]!==0)p++; p++;
      }else{
        if(p+1<d.length)p+=1;
        p+=1;
        while(p<d.length && d[p]!==0)p++; p++;
      }
      const image=d.slice(p);
      if(image.length)return {mime:mime||'image/jpeg',bytes:image};
    }
    pos=dataEnd;
  }
  return null;
}

/* Basic ISO-BMFF/MP4 scanner for iTunes-style cover art (covr).
   We only read the current File temporarily; no audio bytes are stored. */
function parseMP4Artwork(buf){
  const b=new Uint8Array(buf);
  function u32(p){return ((b[p]<<24)|(b[p+1]<<16)|(b[p+2]<<8)|b[p+3])>>>0}
  function type(p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3])}
  function scan(start,end){
    let p=start;
    while(p+8<=end){
      let size=u32(p), typ=type(p+4), head=8;
      if(size===1){
        if(p+16>end)return null;
        const hi=u32(p+8),lo=u32(p+12);
        size=hi*4294967296+lo; head=16;
      }else if(size===0){
        size=end-p;
      }
      if(size<head || p+size>end)return null;
      const a=p+head, z=p+size;
      if(typ==='covr'){
        let q=a;
        while(q+8<=z){
          let s=u32(q), t=type(q+4), h=8;
          if(s===0)s=z-q;
          if(s<h || q+s>z)break;
          const payload=b.slice(q+h,q+s);
          if(t==='data' && payload.length>8){
            const flags=(payload[0]<<24)|(payload[1]<<16)|(payload[2]<<8)|payload[3];
            const img=payload.slice(8);
            let mime='image/jpeg';
            if(img[0]===0x89&&img[1]===0x50&&img[2]===0x4e&&img[3]===0x47)mime='image/png';
            if(img.length>20 && (mime==='image/jpeg'||mime==='image/png'))
              return {mime,bytes:img};
          }
          q+=s;
        }
      }
      if(['moov','udta','meta','ilst','----'].includes(typ)){
        const r=scan(a+(typ==='meta'?4:0),z);
        if(r)return r;
      }
      p+=size;
    }
    return null;
  }
  return scan(0,b.length);
}

async function extractArtwork(file){
  try{
    const name=(file.name||'').toLowerCase();
    // Read only temporarily to obtain embedded cover art.
    const buf=await file.arrayBuffer();
    let art=null;
    if(name.endsWith('.mp3')) art=parseID3Artwork(buf);
    if(!art && (name.endsWith('.m4a')||name.endsWith('.mp4')||name.endsWith('.m4b')||name.endsWith('.aac')))
      art=parseMP4Artwork(buf);
    return art;
  }catch(e){
    return null;
  }
}

function artworkToUrl(art){
  if(!art||!art.bytes)return null;
  return URL.createObjectURL(new Blob([art.bytes],{type:art.mime||'image/jpeg'}));
}


function normalizeFileName(name){
  return (name||'')
    .toLowerCase()
    .normalize('NFKC')
    .replace(/\.[^.]+$/,'')
    .replace(/[\s_\-]+/g,'')
    .replace(/[()\[\]{}]/g,'')
    .replace(/[^a-z0-9가-힣]/g,'');
}
function exactFileName(name){
  return (name||'').toLowerCase().normalize('NFKC');
}
function findExistingByFile(f){
  const fn=exactFileName(f.name);
  const nn=normalizeFileName(f.name);

  // First: exact filename + size. Do NOT require modification time.
  let hit=playlist.find(t =>
    !fileMap.has(t.id) &&
    exactFileName(t.name)===fn &&
    Number(t.size||0)===Number(f.size||0)
  );
  if(hit)return hit;

  // Second: normalized filename + size (handles harmless spacing/symbol differences).
  hit=playlist.find(t =>
    !fileMap.has(t.id) &&
    normalizeFileName(t.name)===nn &&
    Number(t.size||0)===Number(f.size||0)
  );
  if(hit)return hit;

  // Third: exact filename, only when there is a single unmatched candidate.
  const exactCandidates=playlist.filter(t =>
    !fileMap.has(t.id) && exactFileName(t.name)===fn
  );
  if(exactCandidates.length===1)return exactCandidates[0];

  // Fourth: normalized filename, only when unique.
  const normalizedCandidates=playlist.filter(t =>
    !fileMap.has(t.id) && normalizeFileName(t.name)===nn
  );
  if(normalizedCandidates.length===1)return normalizedCandidates[0];

  // Never guess when duplicate names exist.
  return null;
}
async function addFiles(files){
  const arr=Array.from(files||[]).filter(isAudioFile);
  if(!arr.length){
    $('status').textContent='음악 파일을 선택해 주세요.';
    return;
  }

  $('status').textContent='음악 인덱스를 만드는 중입니다…';

  let added=0,relinked=0;
  for(const f of arr){
    // IMPORTANT: metadata only. We do NOT read the file body.
    const rec=findExistingByFile(f);
    if(rec){
      fileMap.set(rec.id,f); // current-session reference only
      relinked++;
      continue;
    }

    const id=crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random();
    const item={
      id,
      name:f.name,
      size:Number(f.size)||0,
      lastModified:Number(f.lastModified)||0,
      type:f.type||'audio/mpeg'
    };

    // Store only the index record. The File object itself is NOT persisted.
    playlist.push(item);
    fileMap.set(id,f);
    added++;
  }

  saveList();
  if(index>=playlist.length) index=Math.max(0,playlist.length-1);
  renderStorageInfo();
  renderPlaylist();

  $('status').textContent=`${added}곡 추가 · ${relinked}곡 원본 연결 완료`;
  if(playlist.length && fileMap.has(playlist[index]?.id)){
    await loadCurrent(true);
  }
}

$('files').addEventListener('change',async e=>{
  await addFiles(e.target.files);
  e.target.value='';
});

$('folderFiles').addEventListener('change',async e=>{
  await relinkFromFolder(e.target.files);
  e.target.value='';
});

async function loadCurrent(autoplay){
  if(!playlist.length){updateUI();return}
  index=Math.max(0,Math.min(index,playlist.length-1));
  const t=playlist[index];
  const f=fileMap.get(t.id);

  if(!f){
    if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}
    audio.pause();
    audio.removeAttribute('src');
    $('now').textContent=t.name;
    $('count').textContent=`${index+1}곡 중 ${playlist.length}곡`;
    if($('mainImage').dataset.url){
      URL.revokeObjectURL($('mainImage').dataset.url);
      $('mainImage').removeAttribute('data-url');
    }
    $('mainImage').src='dog_default.png';
    $('mainImage').alt='음악 폴더를 선택해 주세요';
    $('status').textContent='이 음악을 재생하려면 음악 폴더를 한 번 선택해 주세요.';
    updateUI();
    return;
  }

  if(objectUrl)URL.revokeObjectURL(objectUrl);
  objectUrl=URL.createObjectURL(f);
  audio.src=objectUrl;
  $('now').textContent=t.name;
  $('count').textContent=`${index+1}곡 중 ${playlist.length}곡`;

  if($('mainImage').dataset.url){
    URL.revokeObjectURL($('mainImage').dataset.url);
    $('mainImage').removeAttribute('data-url');
  }

  if(artworkMap.has(t.id)){
    const u=artworkToUrl(artworkMap.get(t.id));
    if(u){
      $('mainImage').src=u;
      $('mainImage').dataset.url=u;
      $('mainImage').alt='앨범 커버';
    }else{
      $('mainImage').src='dog_default.png';
      $('mainImage').alt='말구씨 기본 강아지 이미지';
    }
  }else{
    $('mainImage').src='dog_default.png';
    $('mainImage').alt='말구씨 기본 강아지 이미지';
    // Extract only for the current song; the audio file itself is never stored.
    extractArtwork(f).then(art=>{
      if(playlist[index]?.id===t.id){
        if(art) artworkMap.set(t.id,art);
        if($('mainImage').dataset.url){
          URL.revokeObjectURL($('mainImage').dataset.url);
          $('mainImage').removeAttribute('data-url');
        }
        const u=art?artworkToUrl(art):null;
        $('mainImage').src=u||'dog_default.png';
        if(u)$('mainImage').dataset.url=u;
        $('mainImage').alt=u?'앨범 커버':'말구씨 기본 강아지 이미지';
      }
    });
  }

  audio.load();
  if(autoplay){
    try{await audio.play()}catch(e){}
  }
  $('status').textContent='';
  updateUI();
}

$('btnPlay').onclick=async()=>{
  if(!playlist.length){$('files').click();return}
  const f=fileMap.get(playlist[index]?.id);
  if(!f){
    if(await canUseSavedMusicDirectory()){
      await relinkFolder();
      const refreshed=fileMap.get(playlist[index]?.id);
      if(refreshed){ await loadCurrent(true); closePlaylist(); return; }
    }
    $('status').textContent='이 음악의 원본을 찾을 수 없습니다. 재생목록 관리에서 [음악 폴더 지정]을 눌러 주세요.';
    return;
  }
  if(audio.paused){try{await audio.play()}catch(e){}}
  else audio.pause();
  updateUI();
};
$('btnPrev').onclick=()=>{if(!playlist.length)return;index=(index-1+playlist.length)%playlist.length;loadCurrent(true)};
$('btnNext').onclick=()=>{if(!playlist.length)return;index=(index+1)%playlist.length;loadCurrent(true)};
$('btnAdd').onclick=()=>$('files').click();

function updateRepeatButton(){
  const b=$('btnRepeat');
  if(!b)return;
  const on=!!repeatAll;
  b.classList.toggle('repeat-on',on);
  b.classList.toggle('repeat-off',!on);
  b.textContent=on?'↻  계속 듣기: 켜짐':'↻  계속 듣기: 꺼짐';
}
$('btnRepeat').onclick=()=>{
  repeatAll=!repeatAll;
  localStorage.setItem('repeatAll',repeatAll?'1':'0');
  updateRepeatButton();
};

function renderPlaylist(){
  const box=$('playlistList');
  if(!playlist.length){
    box.innerHTML='<div class="playlist-empty">아직 음악이 없습니다.<br>아래의 ＋ 음악 추가 버튼으로 음악을 넣어 주세요.</div>';
    return;
  }
  box.innerHTML='';
  playlist.forEach((t,i)=>{
    const row=document.createElement('div');
    row.className='track-row';
    row.classList.toggle('selected', i===index);
    row.className='track-row'+(i===index?' current':'');
    row.dataset.index=i;

    const main=document.createElement('button');
    main.className='track-main';
    main.innerHTML=`<span class="num">${i+1}</span><span class="name"></span>`;
    main.querySelector('.name').textContent=t.name;
    main.onclick=async()=>{
      index=i;
      if(!fileMap.has(t.id)){
        if(await canUseSavedMusicDirectory()){
          await relinkFolder();
          if(fileMap.has(t.id)){ await loadCurrent(true); closePlaylist(); return; }
        }
        $('status').textContent='이 음악의 원본을 찾을 수 없습니다. 재생목록 관리에서 [음악 폴더 지정]을 눌러 주세요.';
        return;
      }
      await loadCurrent(true);
      closePlaylist();
    };

    const state=document.createElement('span');
    state.className='track-state';
    state.textContent='';

    const del=document.createElement('button');
    del.className='track-delete';
    del.textContent='삭제';
    del.title='삭제';
    del.onclick=()=>{
      if(!confirm(`"${t.name}"을 재생목록에서 삭제할까요?`))return;
      playlist.splice(i,1);
      fileMap.delete(t.id);
      artworkMap.delete(t.id);
      if(index>i)index--;
      if(index>=playlist.length)index=Math.max(0,playlist.length-1);
      saveList();
      if(playlist.length)loadCurrent(false);
      else {audio.pause();audio.removeAttribute('src');updateUI();}
      renderPlaylist();
      renderStorageInfo();
    };

    row.append(main,state,del);
    box.appendChild(row);
    setupDrag(row);
  });
}


// V3.33: ONLY an explicit folder scan may remove missing playlist index records.
// V3.33_SCAN_ONLY_CLEANUP: 실제 폴더 스캔 후에만 없는 인덱스를 삭제합니다.
function relinkFromFolder(files){
  saveRecentFolderMeta(files);
  const arr=Array.from(files||[]).filter(isAudioFile);
  if(!arr.length){ $('status').textContent='선택한 폴더에서 음악 파일을 찾지 못했습니다.'; return; }
  $('status').textContent=`폴더의 음악 ${arr.length}개와 재생목록을 자동으로 비교하는 중입니다…`;
  fileMap.clear();
  const used=new Set();
  let connected=0;
  for(const t of playlist){
    const fn=exactFileName(t.name), nn=normalizeFileName(t.name);
    let candidates=arr.filter(f=>!used.has(f)&&exactFileName(f.name)===fn&&Number(f.size||0)===Number(t.size||0));
    if(candidates.length===1){fileMap.set(t.id,candidates[0]);used.add(candidates[0]);connected++;continue;}
    candidates=arr.filter(f=>!used.has(f)&&normalizeFileName(f.name)===nn&&Number(f.size||0)===Number(t.size||0));
    if(candidates.length===1){fileMap.set(t.id,candidates[0]);used.add(candidates[0]);connected++;continue;}
    candidates=arr.filter(f=>!used.has(f)&&exactFileName(f.name)===fn);
    if(candidates.length===1){fileMap.set(t.id,candidates[0]);used.add(candidates[0]);connected++;continue;}
    candidates=arr.filter(f=>!used.has(f)&&normalizeFileName(f.name)===nn);
    if(candidates.length===1){fileMap.set(t.id,candidates[0]);used.add(candidates[0]);connected++;continue;}
  }
  const before=playlist.length;
  playlist=playlist.filter(t=>fileMap.has(t.id));
  const removed=before-playlist.length;
  saveVerifiedScan(arr);
  if(index>=playlist.length)index=Math.max(0,playlist.length-1);
  saveList(); renderPlaylist(); renderStorageInfo(); updateUI();
  if(!playlist.length){
    $('status').textContent='폴더에서 재생목록 음악을 찾지 못해 목록을 정리했습니다.';
    audio.pause(); audio.removeAttribute('src'); return;
  }
  $('status').textContent=removed?`${connected}곡 자동 연결 · 찾지 못한 ${removed}곡은 재생목록에서 삭제했습니다.`:`${connected}곡을 자동으로 모두 연결했습니다.`;
  if(fileMap.has(playlist[index]?.id)) loadCurrent(false);
}

async function relinkFolder(){
  const missing=playlist.filter(t=>!fileMap.has(t.id));
  if(!missing.length){
    $('status').textContent='현재 모든 곡이 연결되어 있습니다.';
    return;
  }

  // iPhone Safari: open the native folder picker synchronously from the tap.
  // Do not await before picker.click(), otherwise iOS may reject the picker
  // because the transient user activation has expired.
  const picker=$('folderFiles');
  if(!('showDirectoryPicker' in window)){
    $('status').textContent='음악 폴더를 선택해 주세요.';
    picker.click();
    return;
  }

  // Standard Directory Picker path for browsers that support it.
  if(await canUseSavedMusicDirectory()){
    try{
      const handle=await loadMusicDirectoryHandle();
      const files=[];
      for await(const entry of handle.values()){
        if(entry.kind==='file') files.push(await entry.getFile());
      }
      if(files.length){
        await relinkFromFolder(files);
        $('status').textContent='최근 음악 폴더를 자동으로 확인했습니다.';
        return;
      }
    }catch(e){}
  }

  try{
    const handle=await window.showDirectoryPicker({mode:'read'});
    await saveMusicDirectoryHandle(handle);
    const files=[];
    for await(const entry of handle.values()){
      if(entry.kind==='file') files.push(await entry.getFile());
    }
    await relinkFromFolder(files);
  }catch(e){
    $('status').textContent='음악 폴더 선택이 취소되었습니다.';
  }
}

$('btnRelink').onclick=relinkFolder;

function clearAllIndex(){
  if(!playlist.length){
    $('status').textContent='삭제할 인덱스가 없습니다.';
    return;
  }
  if(!confirm(`재생목록 인덱스 ${playlist.length}곡을 모두 삭제할까요?\n\n원본 음악 파일은 삭제하지 않습니다.`))return;
  playlist=[];
  fileMap.clear();
  artworkMap.clear();
  saveList();
  index=0;
  audio.pause();
  if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}
  audio.removeAttribute('src');
  $('now').textContent='음악을 넣어 주세요';
  $('count').textContent='아직 음악이 없습니다';
  if($('mainImage').dataset.url)URL.revokeObjectURL($('mainImage').dataset.url);
  $('mainImage').removeAttribute('data-url');
  $('mainImage').src='dog_default.png';
  renderPlaylist();
  renderStorageInfo();
  updateUI();
  $('status').textContent='재생목록 인덱스를 모두 삭제했습니다. 원본 음악 파일은 그대로입니다.';
}
$('btnClearStored').onclick=clearAllIndex;

let dragIndex=null,dragRow=null,dragMode=null,dragStartY=0,dragMoved=false;

function clearDropTargets(){
  document.querySelectorAll('.track-row.drop-target').forEach(el=>el.classList.remove('drop-target'));
}
function showDropTarget(clientY){
  const rows=[...document.querySelectorAll('.track-row')].filter(el=>el!==dragRow);
  let target=null;
  for(const r of rows){
    const rect=r.getBoundingClientRect();
    if(clientY<rect.top+rect.height/2){target=r;break}
  }
  clearDropTargets();
  if(target)target.classList.add('drop-target');
}
function finishDrag(clientY){
  if(dragIndex===null||!dragRow)return;
  const rows=[...document.querySelectorAll('.track-row')].filter(el=>el!==dragRow);
  let insertBefore=null;
  for(const r of rows){
    const rect=r.getBoundingClientRect();
    if(clientY<rect.top+rect.height/2){insertBefore=Number(r.dataset.index);break}
  }
  let to=(insertBefore===null)?playlist.length-1:insertBefore;
  const from=dragIndex;
  if(from!==to){
    const item=playlist.splice(from,1)[0];
    if(to>from)to--;
    playlist.splice(to,0,item);
    if(index===from)index=to;
    else if(from<index&&index<=to)index--;
    else if(to<=index&&index<from)index++;
    saveList();
  }
  clearDropTargets();
  dragRow.classList.remove('dragging');
  dragRow=null;dragIndex=null;dragMode=null;dragMoved=false;
  renderPlaylist();
}

function setupDrag(row){
  let mode=null,moved=false,startY=0,pointerId=null,timer=null;

  const clearTimer=()=>{if(timer){clearTimeout(timer);timer=null}};
  const beginDrag=(y,id=null)=>{
    dragIndex=Number(row.dataset.index);
    dragRow=row;
    dragStartY=y;
    moved=false;
    dragMoved=false;
    mode='touch-drag';
    pointerId=id;
    row.classList.add('dragging');
  };

  const touchMove=e=>{
    if(!e.touches.length)return;
    const t=Array.from(e.touches).find(x=>x.identifier===pointerId);
    if(!t)return;
    const dy=Math.abs(t.clientY-startY);

    // Before long-press activates, let iPhone scroll normally.
    if(mode==='touch-pending'){
      if(dy>8){
        clearTimer();
        mode=null;
        pointerId=null;
      }
      return;
    }

    if(mode==='touch-drag'){
      e.preventDefault();
      moved=true;
      showDropTarget(t.clientY);
    }
  };

  const touchEnd=e=>{
    clearTimer();
    const t=Array.from(e.changedTouches).find(x=>x.identifier===pointerId);
    if(mode==='touch-drag'){
      const y=t?t.clientY:startY;
      e.preventDefault();
      finishDrag(y);
    }
    mode=null;pointerId=null;
    document.removeEventListener('touchmove',touchMove,{passive:false});
    document.removeEventListener('touchend',touchEnd,{passive:false});
    document.removeEventListener('touchcancel',touchEnd,{passive:false});
  };

  row.addEventListener('touchstart',e=>{
    if(e.touches.length!==1 || e.target.closest('.track-delete'))return;
    const t=e.touches[0];
    startY=t.clientY;
    pointerId=t.identifier;
    mode='touch-pending';
    timer=setTimeout(()=>{
      if(mode==='touch-pending'){
        beginDrag(startY,pointerId);
      }
    },420);
    document.addEventListener('touchmove',touchMove,{passive:false});
    document.addEventListener('touchend',touchEnd,{passive:false});
    document.addEventListener('touchcancel',touchEnd,{passive:false});
  },{passive:true});

  row.addEventListener('mousedown',e=>{
    if(e.button!==0||e.target.closest('.track-delete'))return;
    dragIndex=Number(row.dataset.index);
    dragRow=row;
    dragStartY=e.clientY;
    mode='mouse';
    row.classList.add('dragging');
    e.preventDefault();

    const mm=ev=>showDropTarget(ev.clientY);
    const mu=ev=>{
      document.removeEventListener('mousemove',mm);
      document.removeEventListener('mouseup',mu);
      finishDrag(ev.clientY);
    };
    document.addEventListener('mousemove',mm);
    document.addEventListener('mouseup',mu);
  });
}

function cancelDrag(){
  clearDropTargets();
  if(dragRow)dragRow.classList.remove('dragging');
  dragRow=null;dragIndex=null;dragMode=null;dragMoved=false;
}

function openPlaylist(){
  renderPlaylist();renderStorageInfo();
  $('playlistScreen').classList.add('open');
  $('playlistScreen').setAttribute('aria-hidden','false');
}
function closePlaylist(){
  $('playlistScreen').classList.remove('open');
  $('playlistScreen').setAttribute('aria-hidden','true');
}
$('btnPlaylist').onclick=openPlaylist;
$('btnClosePlaylist').onclick=closePlaylist;
$('btnPlaylistAdd').onclick=()=>$('files').click();

audio.addEventListener('timeupdate',()=>{
  if(!dragging){
    const d=audio.duration||0,p=audio.currentTime||0;
    $('seekBar').value=d?Math.round(p/d*1000):0;
    $('tvPosition').textContent=formatTime(p*1000);
  }
  $('tvDuration').textContent=formatTime((audio.duration||0)*1000);
});
audio.addEventListener('loadedmetadata',()=>{$('tvDuration').textContent=formatTime((audio.duration||0)*1000)});
audio.addEventListener('play',updateUI);
audio.addEventListener('pause',updateUI);
audio.addEventListener('ended',()=>{
  if(!playlist.length)return;
  if(index<playlist.length-1){index++;loadCurrent(true)}
  else if(repeatAll){index=0;loadCurrent(true)}
  else updateUI();
});
$('seekBar').addEventListener('input',e=>{
  dragging=true;
  const d=audio.duration||0;
  $('tvPosition').textContent=formatTime(d*(Number(e.target.value)/1000));
});
$('seekBar').addEventListener('change',e=>{
  const d=audio.duration||0;
  if(d)audio.currentTime=d*(Number(e.target.value)/1000);
  dragging=false;
});
function formatTime(ms){
  if(!Number.isFinite(ms)||ms<=0)return '00:00';
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function updateUI(){
  $('btnPlay').classList.toggle('pause',!audio.paused&&!!audio.src);
  $('btnPlay').innerHTML=(!audio.paused&&audio.src)
    ?'<span class="icon">❚❚</span><span class="label">잠시멈춤</span>'
    :'<span class="icon">▶</span><span class="label">재생</span>';
  $('count').textContent=playlist.length
    ?`${index+1}곡 중 ${playlist.length}곡`
    :'아직 음악이 없습니다';
  updateRepeatButton();
}
loadIndex();

<script data-selection-highlight-handler>
document.addEventListener('click', function(e){
  const row=e.target.closest('.track-row');
  if(!row) return;
  const i=Number(row.dataset.index);
  if(!Number.isInteger(i)) return;
  if(typeof index!=='undefined' && index!==i){
    index=i;
    document.querySelectorAll('.track-row.selected').forEach(el=>el.classList.remove('selected'));
    row.classList.add('selected');
  }else{
    document.querySelectorAll('.track-row').forEach((el,n)=>el.classList.toggle('selected',n===i));
  }
});
</script>
